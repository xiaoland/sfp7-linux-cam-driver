# The IPU4 firmware available for Surface Pro 7 carries package date
# 20191030, while the recovered CSS sources identify release 20181222.
# Authentication is still performed by the device; this disables only the
# driver's package-date equality check.
options intel_ipu4p fw_version_check=0

# The OV5693 front path passed three independent cold-boot 107-frame SoftISP
# runs at this data/clock-settle pair, and the OV8865 rear path passed two.
# Every scoped interval was free of CSI/IPU/ISYS errors and stop timeouts.
options intel_ipu4p_isys csi2_dsettle=880 csi2_csettle=1400

# The recovered driver is not reload-safe.  Keep discovery from loading a
# partial stack and use sfp7-camera-load once after each development boot.
blacklist ipu_bridge
blacklist intel_ipu4p_isys_csslib
blacklist intel_ipu4p_psys_csslib
blacklist intel_ipu4p
blacklist intel_ipu4p_psys
blacklist intel_ipu4p_isys
